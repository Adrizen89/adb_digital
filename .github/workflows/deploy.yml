name: Build et deploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet un deploiement manuel depuis l'onglet Actions

concurrency:
  # evite deux deploiements simultanes qui se marcheraient dessus en FTP
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier que les secrets sont configures
        # Sans les identifiants FTP, le deploiement echouerait a la derniere
        # etape, apres un build inutile.
        env:
          FTP: ${{ secrets.FTP_SERVER }}
        run: |
          manquants=""
          [ -z "$FTP" ]      && manquants="$manquants FTP_SERVER"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants"
            exit 1
          fi
          echo "secrets presents"

      - name: Build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Verifier que le build est complet
        # Un .htaccess absent casse toutes les routes sauf l'accueil : autant
        # arreter ici plutot que de s'en apercevoir en ligne.
        run: |
          for f in index.html .htaccess robots.txt sitemap.xml og-image.jpg; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f est absent du build"
              exit 1
            fi
          done
          echo "dist/ complet"

      - name: Deployer sur Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # chiffre la connexion : en ftp simple, le mot de passe circule en clair
          local-dir: ./dist/      # le slash final est obligatoire
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          exclude: |
            **/.DS_Store
            **/.git*
            **/.git*/**
